<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker and Vehicle Key Monitor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>
<body>

<!-- Modern Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-lg py-3">
    <div class="container-fluid">
        <a class="navbar-brand fs-3 fw-bold text-primary" href="/">
            <i class="fas fa-tools me-2"></i> REV Autocare
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav fs-5">
                <li class="nav-item px-2">
                    <a class="nav-link active" href="/">
                        <i class="fas fa-home me-1"></i> Home
                    </a>
                </li>
                <li class="nav-item px-2">
                    <a class="nav-link" href="/admin_dashboard">
                        <i class="fas fa-tachometer-alt me-1"></i> Admin Dashboard
                    </a>
                </li>
                <li class="nav-item px-2">
                    <a class="nav-link" href="/employee_time_tracker">
                        <i class="fas fa-user-clock me-1"></i> Employee Time Tracker
                    </a>
                </li>          
                <li class="nav-item px-2">
                    <a class="nav-link" href="/vehicle_key_monitor">
                        <i class="fas fa-car-key me-1"></i> Vehicle Key Monitor
                    </a>
                </li>
            </ul>
        </div>

        <!-- Modernized Live Clock Display -->
        <div class="text-end text-info fw-bold fs-5 me-3">
            <i class="fas fa-clock me-2"></i><span id="liveClock"></span>
        </div>
    </div>
</nav>

    <!-- Content here -->
    {% block content %}{% endblock %}

    <!-- Bootstrap Script (DO NOT REMOVE) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

    <!-- Live Clock Script -->
    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById("liveClock").innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
